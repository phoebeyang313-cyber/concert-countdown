<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Junior 83Z 演唱会倒计时</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #ffffff;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3), 0 0 10px rgba(255, 255, 255, 0.3); }
            50% { text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3), 0 0 20px rgba(255, 255, 255, 0.6); }
        }

        .subtitle {
            color: #e0e0e0;
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin: 40px 0;
        }

        .countdown-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 25px;
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .countdown-item:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .countdown-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #fff;
            display: block;
            margin-bottom: 8px;
        }

        .countdown-label {
            color: #b0b0ff;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .concert-info {
            margin-top: 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #fff;
        }

        .concert-info p {
            margin: 8px 0;
            font-size: 1.1em;
        }

        .date-highlight {
            color: #ffeb3b;
            font-weight: bold;
            font-size: 1.3em;
        }

        .message {
            margin-top: 30px;
            color: #ffd700;
            font-size: 1.3em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            animation: bounce 1s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .finished {
            display: none;
            color: #ffeb3b;
            font-size: 2em;
            font-weight: bold;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .countdown {
                gap: 10px;
            }

            .countdown-number {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="stars" id="starContainer"></div>
    
    <div class="container">
        <h1>🎤 Super Junior 83Z 演唱会 🎤</h1>
        <p class="subtitle">9月19日 不见不散！</p>
        
        <div class="countdown">
            <div class="countdown-item">
                <span class="countdown-number" id="days">0</span>
                <span class="countdown-label">天</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-number" id="hours">0</span>
                <span class="countdown-label">小时</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-number" id="minutes">0</span>
                <span class="countdown-label">分钟</span>
            </div>
            <div class="countdown-item">
                <span class="countdown-number" id="seconds">0</span>
                <span class="countdown-label">秒</span>
            </div>
        </div>

        <div class="concert-info">
            <p>🗓️ 日期: <span class="date-highlight">2024年9月19日</span></p>
            <p>🎉 演唱会即将开始！</p>
            <p>准备好尖叫吧！</p>
        </div>

        <div class="message" id="normalMessage">
            ⏳ 距离演唱会还有...
        </div>

        <div class="finished" id="finishedMessage">
            🎊 演唱会现在进行中！尽情享受！🎊
        </div>
    </div>

    <script>
        function generateStars() {
            const starContainer = document.getElementById('starContainer');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starContainer.appendChild(star);
            }
        }

        function updateCountdown() {
            const concertDate = new Date('2024-09-19T00:00:00').getTime();
            const now = new Date().getTime();
            const distance = concertDate - now;

            if (distance < 0) {
                document.getElementById('normalMessage').style.display = 'none';
                document.getElementById('finishedMessage').style.display = 'block';
                document.getElementById('days').textContent = '0';
                document.getElementById('hours').textContent = '0';
                document.getElementById('minutes').textContent = '0';
                document.getElementById('seconds').textContent = '0';
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = days;
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }

        generateStars();
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
